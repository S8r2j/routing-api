[pytest]
DJANGO_SETTINGS_MODULE = config.settings
asyncio_mode = auto
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as performance benchmarks (deselect with -m "not slow")
    live: marks tests that require a live server at http://localhost:8000 (deselect with -m "not live")
